# Full reference https://github.com/foundry-rs/foundry/tree/master/crates/config

[profile.default]
  auto_detect_solc = false
  block_timestamp = 1_680_220_800 # March 31, 2023 at 00:00 GMT
  bytecode_hash = "none"
  evm_version = "shanghai"
  fuzz = { runs = 1_000 }
  gas_reports = ["*"]
  optimizer = true
  optimizer_runs = 1_000_000
  out = "out"
  script = "script"
  solc = "0.8.26"
  src = "src"
  test = "test"
  skip = ["test/Booster.t.sol", "test/AutoCompoundVault.t.sol", "src/yield/**", "test/yield/**", "script/yield/**"]
  via_ir = true

[profile.ci]
  fuzz = { runs = 10_000 }
  verbosity = 4

# InfiniteVaultStrategy (Velodrome vaults): must fit EIP-170 and match the Cancun opcodes of the live implementation.
[profile.velodrome]
  evm_version = "cancun"
  optimizer_runs = 200
  out = "out-velodrome"
  cache_path = "cache-velodrome"

# AgentSeats + VelodromeItpOracle (Infinite Agents, Optimism): OZ 5.6 needs Cancun (mcopy, transient storage).
# FOUNDRY_PROFILE=agent-seats forge test --match-path 'test/AgentSeats*'
[profile.agent-seats]
  evm_version = "cancun"
  optimizer_runs = 10_000
  out = "out-agent-seats"
  cache_path = "cache-agent-seats"

# Infinite Trading USD Yield vault (Morpho Vault V2 + InfiniteTradingRegistry), Base.
# FOUNDRY_PROFILE=yield forge test --match-path 'test/yield/*'
[profile.yield]
  solc = "0.8.28"
  evm_version = "cancun"
  optimizer_runs = 100_000
  src = "src/yield"
  test = "test/yield"
  script = "script/yield"
  skip = []
  out = "out-yield"
  cache_path = "cache-yield"
  ignored_error_codes = ["transient-storage"]
  fuzz = { runs = 512 }
  invariant = { runs = 128, depth = 40 }

[etherscan]
  optimism = { key = "${API_KEY_OPTIMISTIC_ETHERSCAN}" }
  base = { key = "${BASE_ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=8453" }
  ethereum = { key = "${BASE_ETHERSCAN_API_KEY}" }

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "thousands"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

[rpc_endpoints]
  optimism = "${OPTIMISM_RPC_URL}"
  base = "${BASE_RPC_URL}"
  ethereum = "${ETH_RPC_URL}"
